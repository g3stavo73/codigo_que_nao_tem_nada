<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Aniversário!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8f6f3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
    }

    #timer-screen {
      text-align: center;
    }

    #timer-screen h1 {
      font-size: 20px;
      color: #555;
      margin-bottom: 40px;
      font-weight: 400;
    }

    #timer-display {
      font-size: 80px;
      font-weight: 300;
      color: #333;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    .progress-container {
      width: 200px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 0 auto;
      overflow: hidden;
    }

    #progress-bar {
      width: 100%;
      height: 100%;
      background: #e07a5f;
      border-radius: 2px;
      transition: width 1s linear;
    }

    #message-screen {
      display: none;
      text-align: center;
      max-width: 500px;
      animation: fadeIn 1.5s ease-out;
    }

    #message-screen .emoji-top {
      font-size: 48px;
      margin-bottom: 20px;
    }

    #message-screen h2 {
      font-size: 26px;
      color: #333;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .divider {
      width: 50px;
      height: 2px;
      background: #e07a5f;
      margin: 0 auto 24px;
    }

    #message-screen p {
      font-size: 17px;
      color: #555;
      line-height: 1.8;
      margin-bottom: 8px;
    }

    #message-screen p:last-of-type {
      margin-bottom: 32px;
    }

    .emoji-bottom {
      font-size: 32px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="timer-screen">
    <h1>Espere só um pouquinho...</h1>
    <div id="timer-display">30</div>
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>

  <div id="message-screen">
    <div class="emoji-top">🎂</div>
    <h2>Feliz Aniversário, amor!</h2>
    <div class="divider"></div>
    <p>
      Você é a pessoa mais incrível que já conheci. Cada dia ao seu lado é um presente que eu nunca imaginei merecer.
    </p>
    <p>
      Que esse ano te traga tudo de bom — porque você merece o mundo inteiro. Te amo! 💕
    </p>
    <div class="emoji-bottom">🎁 ✨ 🎈</div>
  </div>

  <script>
    (function() {
      let seconds = 30;
      const timerDisplay = document.getElementById('timer-display');
      const progressBar = document.getElementById('progress-bar');
      const timerScreen = document.getElementById('timer-screen');
      const messageScreen = document.getElementById('message-screen');

      const interval = setInterval(function() {
        seconds--;
        timerDisplay.textContent = seconds < 10 ? '0' + seconds : seconds;
        progressBar.style.width = (seconds / 30 * 100) + '%';

        if (seconds <= 0) {
          clearInterval(interval);
          timerScreen.style.display = 'none';
          messageScreen.style.display = 'block';
        }
      }, 1000);
    })();
  </script>

</body>
</html>
